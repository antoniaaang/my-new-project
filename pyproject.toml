readme = "README.md"
authors = [
    { name = "antonia-ang", email = "146034565+antonia-ang@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "opencv-python>=5.1.0.95",
